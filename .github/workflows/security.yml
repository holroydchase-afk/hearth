name: security
# Secret scan over the full git history (a key committed once and deleted later still fails),
# (npm audit already runs in ci.yml: critical blocks, high and moderate warn). (Dependency review needs the repo's dependency graph
# turned on in Settings, Code security; add the job back when it is.) Add a .gitleaks.toml for a real false positive. The repo's own
# check-private (in CI) covers personal data; this adds keys and known-bad dependencies.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (full history)
        env:
          VERSION: 8.21.2
          SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          curl -sSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
          ./gitleaks git . --redact --no-banner --exit-code 1
