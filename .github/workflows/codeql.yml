name: codeql
# Studio security kit (studio-agents templates/security). CodeQL code scanning;
# results show under Security → Code scanning. Free on public repos. If the repo
# already uses CodeQL "default setup" in Settings, delete this file or turn that off.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "29 6 * * 1"
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: "/language:${{ matrix.language }}"
