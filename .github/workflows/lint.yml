name: lint
# Studio lint gate (intake #199, #204). Strict: every rule at error level fails the job. Inline-style findings stay
# warnings until the shared UI library hand-over (#192).
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: bash scripts/tests/a11y_lint_test.sh
      - run: npm run lint
        env:
          STUDIO_LINT_STRICT: '1'
